schema: spec-driven

context: |
  This OpenSpec root belongs to the standalone Presets Plus fork at
  arnoliudaxia/pi-extensions, originally by Sherif Fanous. The repository keeps
  its pi-extensions name but contains only pi-presets-plus, with src/, tests/,
  and openspec/ at the root. Runtime helpers come from the npm dependency
  @sherif-fanous/pi-extensions-core pinned to 0.1.0. Test doubles and assertions
  from the former private testing package live in tests/support/. AGENTS.md
  at the repository root defines the code, text, configuration, and UI rules.
  Prefer the mise tasks in mise.toml; CONTRIBUTING.md documents equivalent
  commands when mise is unavailable. Preserve original authorship, the MIT
  license, and released changelog history.

  Pi documentation (also installed under
  node_modules/@earendil-works/pi-coding-agent/docs/):
  - Extensions: https://raw.githubusercontent.com/earendil-works/pi/refs/heads/main/packages/coding-agent/docs/extensions.md
  - Packages: https://raw.githubusercontent.com/earendil-works/pi/refs/heads/main/packages/coding-agent/docs/packages.md
  - TUI: https://raw.githubusercontent.com/earendil-works/pi/refs/heads/main/packages/coding-agent/docs/tui.md

rules:
  specs:
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD).
