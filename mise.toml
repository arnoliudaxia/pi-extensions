[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.check]
depends = ["format-check", "type-check", "lint", "test", "changeset-check"]

[tasks.format]
run = "sort-package-json package.json && prettier --write ."

[tasks.format-check]
run = "sort-package-json --check package.json && prettier --check ."

[tasks.type-check]
run = "tsc --noEmit"

[tasks.lint]
run = "eslint src/. tests/."

[tasks.lint-fix]
run = "eslint src/. tests/. --fix"

[tasks.test]
run = "vitest --run"

[tasks.test-watch]
run = "vitest"

[tasks.changeset]
run = "changeset add"

[tasks.changeset-check]
run = "changeset status"

[tasks.version]
run = "changeset version"

[settings]
npm.package_manager = "npm"

[tools]
node = "24"
"npm:pnpm" = { version = "12", allow_builds = ["pnpm"] }
